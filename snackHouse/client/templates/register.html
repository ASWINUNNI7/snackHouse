{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="{% static 'css/register.css' %}">

  {% for message in messages %}
  <script>
    alert('{{ message }}');
  </script>
  {% endfor %}
</head>
<body class="bg-dark text-light">
  <div class="container d-flex justify-content-center align-items-center vh-100 ">
    <div class="card shadow-sm w-100 bg-dark text-light"  style="max-width: 500px;">
      <div class="card-body">
        <div class="text-center mb-4">
          <img src="{% static 'images/minipro_icon.gif' %}" alt="Logo" class="img-fluid" style="max-width: 150px;">
        </div>
        <h3 class="text-center mb-3">Register</h3>

        <form method="POST" class="needs-validation" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Full Name" required>
            <div class="invalid-feedback">
              Please provide your full name.
            </div>
          </div>

          <div class="mb-3">
            <label for="mobile" class="form-label">Mobile</label>
            <input type="text" id="mobile" name="mobile" class="form-control" placeholder="+91" required>
            <div class="invalid-feedback">
              Please provide your mobile number.
            </div>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="email" id="username" name="username" class="form-control" placeholder="@gmail.com" required>
            <div class="invalid-feedback">
              Please provide a valid email address.
            </div>
          </div>

          <div class="mb-3">
            <label for="password1" class="form-label">Password</label>
            <input type="password" id="password1" name="password1" class="form-control" placeholder="Create a password" required>
            <div class="invalid-feedback">
              Please create a password.
            </div>
          </div>

          <div class="mb-3">
            <label for="password2" class="form-label">Confirm Password</label>
            <input type="password" id="password2" name="password2" class="form-control" placeholder="Confirm your password" required>
            <div class="invalid-feedback">
              Please confirm your password.
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>

        <p class="text-center text-muted mt-4">OR</p>

        <div class="d-grid">
          <a href="{% url 'login' %}" class="btn btn-secondary">Log in</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Bootstrap validation
    (function () {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>
</html>
