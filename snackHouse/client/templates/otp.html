{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  
  {% for message in messages %}
  <script>
    alert('{{ message }}');
  </script>
  {% endfor %}
</head>
<body class="bg-dark text-white">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="login-section bg-secondary rounded p-4 shadow-lg" id="main" style="max-width: 400px; width: 100%;">
      <!-- Logo -->
      <div class="text-center mb-3">
        <img src="{% static 'images/minipro_icon.gif' %}" alt="Logo" class="img-fluid" style="max-height: 100px;">
      </div>

      <!-- Form -->
      <form method="POST" class="login-form">
        {% csrf_token %}
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="mail" class="form-control" value="{{ user.username }}" readonly>
        </div>
        <div class="mb-3">
          <label for="otp" class="form-label">OTP</label>
          <input type="text" id="otp" name="otp" class="form-control" maxlength="4" placeholder="AC-xxxx" required>
        </div>
        <button id="login" type="submit" class="btn btn-primary w-100">Submit</button>
      </form>

      <!-- Back Button -->
      <div class="text-center mt-4">
        <a href="{% url 'otpBack' %}" class="btn btn-warning w-100">Back</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
