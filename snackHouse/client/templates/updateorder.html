{% extends 'home.html' %}
{% block title %}Food{% endblock %}
{% block style %}
<style>
   body {
      background-color: rgb(185, 176, 176);
   }
</style>
{% for message in messages %}
<script>
   alert('{{ message }}');
</script>
{% endfor %}
{% endblock %}
{% block content %}
<div class="container py-5 my-5">
   <div class="row justify-content-center">
      <div class="col-md-6">
         <div class="card">
            <img src="{{ food.food_image.url }}" style="height: 250px; object-fit: cover;" class="card-img-top" alt="Food Image">
            <div class="card-body">
               <h5 class="card-title text-center text-uppercase fw-bold" style="font-family: 'Cormorant Garamond', serif; font-size: 1.2rem;">
                  {{ food.food_name }}
               </h5>
               <p class="text-center fw-bold">Rs {{ price }}</p>
               <form action="updateOrderFood" method="post">
                  <div class="mb-3 d-flex justify-content-center">
                     <input type="number" class="form-control text-center" style="width: 100px;" name="fquantity" id="quant" value="{{ food.quantity }}" min="1" max="{{ size }}">
                     <input type="hidden" name="foodname" value="{{ food.food_name }}">
                  </div>
                  <div class="d-flex justify-content-center">
                     <button type="submit" class="btn btn-warning">Update</button>
                  </div>
               </form>
            </div>
         </div>
      </div>
   </div>
</div>
{% endblock %}
